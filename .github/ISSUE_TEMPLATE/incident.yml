name: Report an incident
description: Add a sourced AI agent safety or security incident.
title: "[Incident] "
body:
  - type: input
    id: source
    attributes:
      label: Public source URL
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Event or report date
      description: Specify which date the source establishes.
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened and what remains uncertain
      description: Include the affected product and evidence limits. Do not include credentials or customer data.
    validations:
      required: true
